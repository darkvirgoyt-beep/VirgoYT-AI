version: "3.9"

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - CLIENT_ORIGIN=http://localhost:3000
      - JWT_SECRET=${JWT_SECRET:-change-me-in-prod}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - WORKSPACE_ROOT=/app/workspaces
    volumes:
      - virgoyt-workspaces:/app/workspaces
      - virgoyt-db:/app/server/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - server
    restart: unless-stopped

  desktop:
    build:
      context: .
      dockerfile: desktop/Dockerfile
    ports:
      - "8081:8080"
    environment:
      - DESKTOP_PASSWORD=${DESKTOP_PASSWORD:-change-me-before-deploy}
      - PORT=8080
      - VNC_PORT=5901
    volumes:
      - virgoyt-desktop:/home/virgo
    restart: unless-stopped

volumes:
  virgoyt-workspaces:
  virgoyt-db:
  virgoyt-desktop:
