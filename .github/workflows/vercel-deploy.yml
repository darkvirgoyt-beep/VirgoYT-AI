name: Auto-Deploy to Vercel

on:
  push:
    branches: [main, master]
    paths:
      - 'web/**'
      - '!web/.next/**'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Refresh Vercel access token
        run: |
          set -e
          TOKEN=$(curl -s -X POST "https://api.vercel.com/login/oauth/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "User-Agent: vercel-cli" \
            --data-urlencode "client_id=cl_HYyOPBNtFMfHhaUn9L4QPfTZz6TP47bp" \
            --data-urlencode "grant_type=refresh_token" \
            --data-urlencode "refresh_token=${{ secrets.VERCEL_REFRESH_TOKEN }}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('access_token') or '')" )
          if [ -z "$TOKEN" ]; then
            echo "refresh-token stale, falling back to VERCEL_TOKEN secret"
            echo "VERCEL_TOKEN=${{ secrets.VERCEL_TOKEN }}" >> "$GITHUB_ENV"
          else
            echo "VERCEL_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          fi

      - name: Deploy to Vercel (Production)
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

      - name: Build Project
        run: vercel build --prod --token=$VERCEL_TOKEN
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}